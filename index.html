<!doctype html>
<html lang="en">
  <head>
    <script>
      // Sandboxed iframe compatibility for global fetch setter
      (function() {
        try {
          var _currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Pass-through if already configurable or locked
        }
      })();
    </script>
    <meta charset="UTF-8" />
